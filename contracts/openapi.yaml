    SalaryRuleCategory:
      type: string
      enum:
      - BASIC
      - ALLOWANCE
      - GROSS
      - DEDUCTION
      - NET
      title: SalaryRuleCategory
      description: 'Categorization of a salary rule.


        Allowed categories:

        - BASIC: Base salary or fixed contract compensation.

        - ALLOWANCE: Additions (e.g. HRA, Transport, Meal, Medical allowance).

        - GROSS: Intermediate total before deductions (e.g. BASIC + ALLOWANCES).

        - DEDUCTION: Subtractions (e.g. PF, Tax, Social Security, unpaid leave deduction).

        - NET: Final payable remuneration (e.g. GROSS - DEDUCTIONS).'
    SalaryRuleCreate:
      properties:
        salary_structure_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Salary Structure Id
          description: ID of parent salary structure
        name:
          type: string
          maxLength: 100
          minLength: 2
          title: Name
          description: Rule display name (e.g. Basic Salary, HRA)
        code:
          type: string
          maxLength: 50
          minLength: 1
          title: Code
          description: Rule reference code (e.g. BASIC, HRA, GROSS, NET)
        category:
          $ref: '#/components/schemas/SalaryRuleCategory'
          description: Rule category (BASIC, ALLOWANCE, GROSS, DEDUCTION, NET)
        sequence:
          type: integer
          maximum: 9999.0
          minimum: 1.0
          title: Sequence
          description: Execution order sequence (ascending)
        computation_type:
          $ref: '#/components/schemas/ComputationType'
          description: Calculation method (FIXED, PERCENTAGE, FORMULA)
        fixed_amount:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,2}0*$
          - type: 'null'
          title: Fixed Amount
          description: Fixed amount in currency units (required when computation_type
            is FIXED)
        percentage:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,2}0*$
          - type: 'null'
          title: Percentage
          description: Percentage rate between 0.00 and 100.00 (required when computation_type
            is PERCENTAGE)
        percentage_base:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Percentage Base
          description: Base rule code to compute percentage against (required when
            computation_type is PERCENTAGE)
        formula:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Formula
          description: Restricted mathematical formula (required when computation_type
            is FORMULA)
        is_active:
          type: boolean
          title: Is Active
          description: Active status flag
          default: true
      type: object
      required:
      - salary_structure_id
      - name
      - code
      - category
      - sequence
      - computation_type
