openapi: 3.1.0
info:
  title: PeoplePay360 API
  description: 'HR & Payroll Backend — Phase 7: Payruns & Payslips'
  version: 0.0.10
paths:
  /api/v1/health:
    get:
      tags:
      - Health
      summary: Liveness check
      description: Return a simple OK response to confirm the service is running.
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      description: 'Create a new user account.


        - Validates input (email format, password strength, valid role).

        - Rejects duplicate emails with 409.

        - Hashes the password before storage.

        - Returns safe user data — password is never included.'
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate and receive a token pair
      description: 'Log in with email and password.


        - Returns an access token (short-lived) and a refresh token (long-lived).

        - Returns a generic 401 for any credential failure (no email-existence leakage).

        - Returns 403 if the account is inactive.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh an access token using a refresh token
      description: 'Exchange a valid refresh token for a new access + refresh token
        pair.


        - Returns 401 if the refresh token is invalid or expired.

        - Returns 403 if the user account is inactive.'
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Return the currently authenticated user
      description: 'Return the profile of the currently authenticated user.


        Requires a valid Bearer access token.

        Password hash is never included in the response.'
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/v1/users:
    get:
      tags:
      - Users
      summary: List user login accounts for employee linking
      description: 'Retrieve user accounts with eager role and employee associations.


        Secured to Master Data Administrators and HR Managers.

        Supports filtering to unlinked accounts for assignment comboboxes.'
      operationId: list_users_api_v1_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: unlinked_only
        in: query
        required: false
        schema:
          type: boolean
          description: Filter to only users not currently linked to an employee record
          default: false
          title: Unlinked Only
        description: Filter to only users not currently linked to an employee record
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search user accounts by email address
          title: Search
        description: Search user accounts by email address
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Users Api V1 Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dashboard/summary:
    get:
      tags:
      - Dashboard
      summary: Get Dashboard Summary
      description: 'Return comprehensive, live executive KPIs and telemetry for HRMS
        & Payroll Dashboard:

        - Active headcount and department rosters (filtered by dept/status)

        - Running contracts, wage commitments, expiring & draft contracts (excluding
        terminated employees)

        - Attendance metrics: present, late, absent, incomplete, half-day, overtime,
        manual edits, coverage rate

        - Approved on-leave counts and pending leave requests

        - Real department salary breakdown and headcount distribution with consistent
        denominators

        - Monthly payroll liabilities & recent payruns

        - Action items dynamically triggered by database state, including missing
        bank details warnings'
      operationId: get_dashboard_summary_api_v1_dashboard_summary_get
      parameters:
      - name: period_start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Period Start
      - name: period_end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Period End
      - name: department_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Department Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EmployeeStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/roles:
    get:
      tags:
      - Roles
      summary: List all roles
      description: Return all system roles. Public endpoint (no login required).
      operationId: list_roles_api_v1_roles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RoleResponse'
                type: array
                title: Response List Roles Api V1 Roles Get
  /api/v1/roles/{role_id}:
    get:
      tags:
      - Roles
      summary: Get role by ID
      description: Return a single role by its integer ID. Public endpoint (no login
        required).
      operationId: get_role_api_v1_roles__role_id__get
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: integer
          title: Role Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/departments:
    get:
      tags:
      - Departments
      summary: List departments
      description: List departments. Available to all authenticated users.
      operationId: list_departments_api_v1_departments_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          description: Include deactivated departments
          default: false
          title: Include Inactive
        description: Include deactivated departments
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentResponse'
                title: Response List Departments Api V1 Departments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Departments
      summary: Create department
      description: Create a new department. Requires HR_MANAGER, HR_PAYROLL_MANAGER,
        or ADMIN role.
      operationId: create_department_api_v1_departments_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/departments/{department_id}:
    get:
      tags:
      - Departments
      summary: Get department by ID
      description: Get department details by ID. Available to all authenticated users.
      operationId: get_department_api_v1_departments__department_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: department_id
        in: path
        required: true
        schema:
          type: integer
          title: Department Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Departments
      summary: Update department
      description: Update department details. Requires HR_MANAGER, HR_PAYROLL_MANAGER,
        or ADMIN role.
      operationId: update_department_api_v1_departments__department_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: department_id
        in: path
        required: true
        schema:
          type: integer
          title: Department Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Departments
      summary: Deactivate department
      description: Soft-deactivate a department. Requires HR_MANAGER, HR_PAYROLL_MANAGER,
        or ADMIN role.
      operationId: deactivate_department_api_v1_departments__department_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: department_id
        in: path
        required: true
        schema:
          type: integer
          title: Department Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/job-positions:
    get:
      tags:
      - Job Positions
      summary: List job positions
      description: List job positions. Available to all authenticated users.
      operationId: list_job_positions_api_v1_job_positions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          description: Include deactivated positions
          default: false
          title: Include Inactive
        description: Include deactivated positions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobPositionResponse'
                title: Response List Job Positions Api V1 Job Positions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Job Positions
      summary: Create job position
      description: Create a new job position. Requires HR_MANAGER, HR_PAYROLL_MANAGER,
        or ADMIN role.
      operationId: create_job_position_api_v1_job_positions_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPositionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPositionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/job-positions/{job_position_id}:
    get:
      tags:
      - Job Positions
      summary: Get job position by ID
      description: Get job position details by ID. Available to all authenticated
        users.
      operationId: get_job_position_api_v1_job_positions__job_position_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_position_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Position Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPositionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Job Positions
      summary: Update job position
      description: Update job position details. Requires HR_MANAGER, HR_PAYROLL_MANAGER,
        or ADMIN role.
      operationId: update_job_position_api_v1_job_positions__job_position_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: job_position_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Position Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPositionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPositionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Job Positions
      summary: Deactivate job position
      description: Soft-deactivate a job position. Requires HR_MANAGER, HR_PAYROLL_MANAGER,
        or ADMIN role.
      operationId: deactivate_job_position_api_v1_job_positions__job_position_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: job_position_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Position Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPositionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/employees:
    post:
      tags:
      - Employees
      summary: Create employee
      description: 'Create a new employee record.


        RBAC Policy:

        - Allowed roles: HR_MANAGER, HR_PAYROLL_USER, HR_PAYROLL_MANAGER, ADMIN.

        - Blocked: Ordinary EMPLOYEE role (403 Forbidden).'
      operationId: create_employee_api_v1_employees_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Employees
      summary: List employees
      description: 'List employees with optional search, filtering, and pagination.


        Total matching record count is returned in the `X-Total-Count` HTTP response
        header.'
      operationId: list_employees_api_v1_employees_get
      security:
      - HTTPBearer: []
      parameters:
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Pagination offset
          default: 0
          title: Skip
        description: Pagination offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Items per page
          default: 50
          title: Limit
        description: Items per page
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by name, code, or email
          title: Search
        description: Search by name, code, or email
      - name: department_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by department ID
          title: Department Id
        description: Filter by department ID
      - name: job_position_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by job position ID
          title: Job Position Id
        description: Filter by job position ID
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EmployeeStatus'
          - type: 'null'
          description: Filter by employee status
          title: Status
        description: Filter by employee status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeResponse'
                title: Response List Employees Api V1 Employees Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/employees/me:
    get:
      tags:
      - Employees
      summary: Get current user's employee profile
      description: 'Self-service endpoint for any authenticated user to fetch their
        own linked employee profile.


        Does not require HR roles; available to any authenticated user with a linked
        employee record.'
      operationId: get_my_employee_profile_api_v1_employees_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
      security:
      - HTTPBearer: []
  /api/v1/employees/me/attendance:
    get:
      tags:
      - Employees
      summary: Get current logged-in employee attendance history
      description: List attendance history for the currently authenticated employee.
      operationId: get_my_attendance_api_v1_employees_me_attendance_get
      security:
      - HTTPBearer: []
      parameters:
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Start date filter (YYYY-MM-DD)
          title: Date From
        description: Start date filter (YYYY-MM-DD)
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: End date filter (YYYY-MM-DD)
          title: Date To
        description: End date filter (YYYY-MM-DD)
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AttendanceStatus'
          - type: 'null'
          description: Filter by status
          title: Status
        description: Filter by status
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/employees/me/time-off/allocations:
    get:
      tags:
      - Employees
      summary: Get current logged-in employee time off allocations
      description: List all leave allocations for the currently authenticated employee.
      operationId: get_my_time_off_allocations_api_v1_employees_me_time_off_allocations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: time_off_type_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by leave type ID
          title: Time Off Type Id
        description: Filter by leave type ID
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/AllocationStatus'
          - type: 'null'
          description: Filter by allocation status
          title: Status
        description: Filter by allocation status
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeOffAllocationResponse'
                title: Response Get My Time Off Allocations Api V1 Employees Me Time
                  Off Allocations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/employees/me/time-off/requests:
    get:
      tags:
      - Employees
      summary: Get current logged-in employee time off requests
      description: List all leave requests for the currently authenticated employee.
      operationId: get_my_time_off_requests_api_v1_employees_me_time_off_requests_get
      security:
      - HTTPBearer: []
      parameters:
      - name: time_off_type_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filter by leave type ID
          title: Time Off Type Id
        description: Filter by leave type ID
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TimeOffRequestStatus'
          - type: 'null'
          description: Filter by request status
          title: Status
        description: Filter by request status
      - name: from_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Filter requests ending on or after this date
          title: From Date
        description: Filter requests ending on or after this date
      - name: to_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Filter requests starting on or before this date
          title: To Date
        description: Filter requests starting on or before this date
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeOffRequestResponse'
                title: Response Get My Time Off Requests Api V1 Employees Me Time
                  Off Requests Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Employees
