      - COMPUTED
      - VALIDATED
      - PAID
      - CANCELLED
      title: PayrunStatus
      description: 'Lifecycle status of a payroll run.


        States:

        - DRAFT: Payrun created with selected employees; payslips drafted, not yet
        computed.

        - COMPUTED: Calculation engine has executed across all payslips; figures are
        ready for review.

        - VALIDATED: Audit checks passed with no blocking errors; ready for settlement.

        - PAID: Financial settlement finalized; records are historically frozen.

        - CANCELLED: Voided batch.'
